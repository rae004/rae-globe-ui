[project]
name = "globe-api"
version = "0.0.0"
description = "FastAPI service: launches and their orbital trajectories."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165",
    "globe-db",
    "sgp4>=2.27",
    "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
