[project]
name = "globe-db"
version = "0.0.0"
description = "Postgres data layer: models, migrations and launch data."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "httpx>=0.29",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
]

[project.scripts]
globe-db = "globe_db.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
