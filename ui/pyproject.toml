[project]
name = "globe-ui"
version = "0.0.0"
description = "Streamlit globe UI: pick a launch, see its pad and orbit."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.29",
    "plotly>=7.2",
    "pydantic-settings>=2.16",
    "streamlit>=1.67",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
