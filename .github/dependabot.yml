version: 2
updates:
  # The whole workspace (db, api, ui) is locked by the root uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # The PR title becomes the squash commit, and release.yml reads its type.
    # A bump to a runtime dependency is a `fix`, so it cuts a patch release;
    # a dev-only bump is a `chore` and releases nothing.
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    labels:
      - dependencies
      - python

  # Base images in the three Dockerfiles. They are what the services run on,
  # so a bump is a `fix`, like any other runtime dependency.
  - package-ecosystem: docker
    directories:
      - /db
      - /api
      - /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
      include: "scope"
    labels:
      - dependencies
      - docker

  # The Postgres image in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
      include: "scope"
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Workflow-only changes never need a release.
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - dependencies
      - ci
